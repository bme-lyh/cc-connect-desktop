name: Windows portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the archive
        required: true
        default: dev
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Test and build
        shell: pwsh
        run: |
          go test ./config ./core ./internal/secretstore -run 'Test(SimpleSetup|LoadPermissive_AllowsZeroProjects|SecretStore|ProjectEnabled)'
          go vet ./config ./core ./internal/secretstore
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o build/cc-connect.exe ./cmd/cc-connect
      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ inputs.version }}') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          ./scripts/package-windows.ps1 -Version $version -ExePath ./build/cc-connect.exe -OutputDir ./release
      - uses: actions/upload-artifact@v4
        with:
          name: cc-connect-windows-amd64
          path: |
            release/*.zip
            release/*.sha256
